# RAG Chatbot Configuration
# This file controls all aspects of the chatbot behavior

# Operational Mode
# - "hybrid": Run both chatbot web UI and MCP server (default)
# - "chatbot": Run only chatbot web UI without MCP server
# - "mcp_server": Run only MCP server without LLM (headless mode)
mode: "hybrid"

# LLM Configuration
llm:
  # Provider: "ollama" for local Ollama, "huggingface" for HuggingFace models
  provider: "ollama"
  
  # Model name (used when multi_model is not configured)
  # For Ollama: "llama3.2", "mistral", "codellama", etc.
  # For HuggingFace: "mistralai/Mistral-7B-Instruct-v0.2", "meta-llama/Llama-2-7b-chat-hf", etc.
  model_name: "llama3.2"
  
  # Ollama base URL (only used when provider is "ollama")
  base_url: "http://localhost:11434"
  
  # Generation parameters
  max_tokens: 512
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  
  # HuggingFace-specific settings (only used when provider is "huggingface")
  # Quantization level: "4bit", "8bit", or "none"
  # Note: bitsandbytes quantization only works with CUDA, not MPS
  quantization: "none"
  
  # Device: "mps" for Mac M3, "cuda" for NVIDIA GPU, "cpu" for CPU only
  device: "mps"
  
  # Multi-model configuration (optional)
  # When enabled, different models are used for different purposes
  multi_model:
    reasoning:
      provider: "ollama"
      model_name: "deepseek-r1:1.5b"
      base_url: "http://localhost:11434"
      max_tokens: 512
      temperature: 0.3
      top_p: 0.9
      top_k: 50
      role: "reasoning"
    
    main:
      provider: "ollama"
      model_name: "gemma4:e2b-it-q4_K_M"
      base_url: "http://localhost:11434"
      max_tokens: 512
      temperature: 0.7
      top_p: 0.9
      top_k: 50
      role: "main"
    
    fallback:
      provider: "ollama"
      model_name: "qwen2.5:7b"
      base_url: "http://localhost:11434"
      max_tokens: 512
      temperature: 0.7
      top_p: 0.9
      top_k: 50
      role: "fallback"

# RAG System Configuration
rag:
  # Storage backend: "page_index" (current) or "vector_db" (future)
  storage_type: "page_index"
  
  # Document chunking parameters
  chunk_size: 1000
  chunk_overlap: 200
  
  # Retrieval settings
  top_k: 3
  
  # Index persistence path
  index_path: "data/index/page_index.json"

# Internet Search Configuration
search:
  # Search provider: "duckduckgo" (no API key required)
  provider: "duckduckgo"
  
  # Maximum number of search results to retrieve
  max_results: 5
  
  # Cache settings
  cache_ttl_seconds: 3600

# Web Server Configuration
server:
  host: "localhost"
  port: 8000
  
  # CORS settings for frontend
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"

# MCP Server Configuration
mcp_server:
  # Enable MCP server (auto-enabled in hybrid/mcp_server modes)
  enabled: true
  
  # Transport protocol: "stdio" or "sse"
  # - stdio: For Claude Desktop integration (process-based)
  # - sse: For HTTP-based clients (Server-Sent Events)
  transport: "sse"
  
  # Server name (shown to MCP clients)
  name: "rag-search-server"
  
  # Port for SSE transport (ignored for stdio)
  port: 8001

# MCP Client Configuration (for connecting to external MCP servers)
mcp_clients: []
  # Example MCP server configurations
  # Uncomment and configure as needed
  
  # - name: "filesystem"
  #   enabled: false
  #   transport: "stdio"
  #   command: "npx"
  #   args: ["-y", "@modelcontextprotocol/server-filesystem", "/path/to/allowed/directory"]
  
  # - name: "github"
  #   enabled: false
  #   transport: "stdio"
  #   command: "npx"
  #   args: ["-y", "@modelcontextprotocol/server-github"]
  #   env:
  #     GITHUB_PERSONAL_ACCESS_TOKEN: "your-token-here"

# Conversation Settings
conversation:
  # Maximum messages to keep in history
  max_history: 10
  
  # SQLite database path for conversation persistence
  db_path: "data/conversations.db"

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/chatbot.log"

# Persistent Memory System
memory:
  enabled: true
  store_path: "data/memory/memories.db"
  max_context_items: 8
  context_window: 2000

# Task Execution Framework
tasks:
  enabled: true  # Set to true after configuring MCP clients below
  require_confirmation: true
  task_clients:
    - name: "calendar"
      enabled: false
      command: "python"
      args: ["mcp_clients/mcp_calendar_macos.py"]
    - name: "reminders"
      enabled: false
      command: "python"
      args: ["mcp_clients/mcp_reminders_macos.py"]

# Learning Feedback Loop
learning:
  enabled: true
  adaptation_rate: 0.1
  positive_increment: 0.1
  negative_decrement: 0.08

# Proactive Capabilities
proactive:
  enabled: true  # Set to true to enable daily briefings and nudges
  briefing_hour: 9
  cycle_interval_minutes: 30
  quiet_hours_start: 22
  quiet_hours_end: 8

# Security Hardening
security:
  security_headers: true
  log_redaction: true
  max_request_size_mb: 30
  ws_max_message_length: 10000
  audit_log_path: "logs/audit.log"
  rate_limiting:
    enabled: true
    default_rpm: 60       # requests per minute per IP (general endpoints)
    upload_rph: 10        # uploads per hour per IP
    ws_rpm: 30            # WebSocket messages per minute per client

# Authentication (disabled by default — enable when ready to protect endpoints)
# Set RAGENIE_SECRET_KEY env var before enabling in production!
auth:
  enabled: true
  db_path: "data/auth/users.db"
  access_token_expire_minutes: 30
  refresh_token_expire_days: 7

# News Aggregator & Summariser (uses DuckDuckGo News — no API key required)
news:
  enabled: true
  db_path: "data/news/news.db"
  region: "wt-wt"              # worldwide / any language (default — recommended)
                               # Keywords in any script (Devanagari, Tamil, etc.) work
                               # automatically with wt-wt; change region to bias results:
                               #
                               # Indian languages:
                               #   in-en  English (India)    in-hi  Hindi
                               #   in-bn  Bengali            in-te  Telugu
                               #   in-mr  Marathi            in-ta  Tamil
                               #   in-gu  Gujarati           in-kn  Kannada
                               #   in-ml  Malayalam          in-pa  Punjabi
                               #   in-or  Odia               in-ur  Urdu
                               #
                               # Other: us-en, gb-en, de-de, fr-fr, jp-jp, xa-ar
  default_fetch_interval_minutes: 60
  default_max_articles_per_fetch: 10
  summarise_on_fetch: true
  ingest_into_rag: false       # Set true to make articles searchable in chat
  max_content_chars: 8000
  summary_max_sentences: 5
  retention_days: 3            # Articles older than this are deleted automatically
  cleanup_interval_hours: 6    # How often the retention job runs

# MCP Client Configuration
# Controls the new MCP client module that connects RAGenie to external MCP servers.
# Server configurations are stored in the SQLite DB (not here) and managed via the Web UI.
mcp_client:
  store_path: "data/mcp_client/servers.db"  # SQLite DB for MCP server configs
